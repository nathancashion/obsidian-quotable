name: Release

# Builds release assets in CI and attaches a signed provenance attestation, so
# users can verify the published main.js was built from this repository rather
# than assembled on someone's laptop.
#
# Cutting a release therefore means pushing a tag, not running `gh release create`
# locally — a locally built asset cannot be attested.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # Both required by attest-build-provenance: id-token to request the signing
  # certificate, attestations to record the result.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # A tag should never publish something that doesn't build or pass.
      - run: npm test
      - run: npm run build

      - name: Check the tag matches the manifest
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version" >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" main.js manifest.json styles.css --clobber
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
