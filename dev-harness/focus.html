<!doctype html>
<html><head><meta charset="utf-8"><title>Swatch focus check</title>
<style>
  /* Stand-ins for the Obsidian theme variables styles.css depends on. */
  :root {
    --size-4-2: 8px; --size-4-3: 12px; --size-4-4: 16px;
    --background-primary: #1e1e1e; --background-secondary: #262626;
    --background-modifier-border: #3a3a3a;
    --text-normal: #dcddde; --text-muted: #888; --text-on-accent: #fff;
    --interactive-accent: #7b6cd9;
    --font-ui-small: 13px; --font-ui-smaller: 12px; --font-ui-large: 18px;
    --font-monospace: monospace;
  }
  body { background: var(--background-primary); color: var(--text-normal);
         font-family: -apple-system, sans-serif; padding: 24px; margin: 0; }
  h1 { font-size: 14px; color: var(--text-muted); font-weight: 500; }
  button { background: var(--background-secondary); color: var(--text-normal);
           border: 1px solid var(--background-modifier-border); border-radius: 5px;
           padding: 6px 12px; font-size: 13px; }
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Swatch focus indicator — tab through the row</h1>
<div class="quotable-modal">
  <div class="quotable-swatches" id="row"></div>
  <div class="quotable-row quotable-actions">
    <button class="mod-cta">Save image…</button>
    <button>Save collection</button>
    <button>Copy image</button>
    <button>Insert in note</button>
  </div>
</div>
<script>
  const COLORS = ['#2b6cb0','#7a4b2a','#c9a888','#3f6f5f','#ffffff','#2b2b2b'];
  const row = document.getElementById('row');
  COLORS.forEach((c,i) => {
    const b = document.createElement('button');
    b.className = 'quotable-swatch' + (i === 2 ? ' is-active' : '');
    b.style.setProperty('--quotable-swatch', c);
    b.setAttribute('aria-label', 'palette ' + i);
    row.appendChild(b);
  });
</script>
</body></html>
